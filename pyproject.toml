[project]
name = "mechanalyzer"
version = "2025.10.0"
description = "Tools for construction, manipulation, visualization of chemical mechanisms"
authors = [{name = "avcopan", email = "avcopan@gmail.com"}]
readme = "README.md"
dependencies = []
requires-python = ">=3.11"

[project.scripts]
mechanalyzer = "mechanalyzer.cli:main"

[dependency-groups]
test = ["pytest"]

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

# Hatchling configurations
[tool.hatch.build.targets.sdist]
include = ["mechanalyzer", "ratefit", "thermfit"]

[tool.hatch.build.targets.wheel]
include = ["mechanalyzer", "ratefit", "thermfit"]

# Pixi configurations
[tool.pixi.workspace]
channels = ["conda-forge", "Auto-Mech"]
platforms = ["linux-64"]
preview = ["pixi-build"]

#   - Build
[tool.pixi.package]
name = "mechanalyzer"

[tool.pixi.package.build]
backend = { name = "pixi-build-python", version = "==0.3.2" }

[tool.pixi.package.host-dependencies]
hatchling = "==1.26.3"

[tool.pixi.package.run-dependencies]
click = ">=8.2.1"
mako = ">=1.3.10"
matplotlib = ">=3.10.6"
networkx = ">=3.3"
numpy = ">=1.26"
pandas = ">=2.3.3"
python-igraph = ">=0.11.9"
pyyaml = ">=6.0.3"
scipy = ">=1.12"
autochem = ">=2025.10.0"
autoio = ">=2025.10.0"
autofile = ">=2025.10.0"

#   - Other
[tool.pixi.pypi-dependencies]
mechanalyzer = { path = ".", editable = true }

[tool.pixi.dependencies]
click = ">=8.2.1"
mako = ">=1.3.10"
matplotlib = ">=3.10.6"
networkx = ">=3.3"
numpy = ">=1.26"
pandas = ">=2.3.3"
python-igraph = ">=0.11.9"
pyyaml = ">=6.0.3"
scipy = ">=1.12"
autochem = ">=2025.10.0"
autoio = ">=2025.10.0"
autofile = ">=2025.10.0"

[tool.pixi.feature.build.dependencies]
rattler-build = ">=0.47.1"

[tool.pixi.environments]
test = ["test"]
build = ["build"]
dev = ["test", "build"]


[tool.pixi.feature.test.tasks]
test-mechanalyzer = "pytest -v mechanalyzer"
test-examples = "pytest -v examples"
test-ratefit = "pytest -v ratefit"
test = { depends-on = ["test-mechanalyzer", "test-examples", "test-ratefit"] }

[tool.pixi.feature.build.tasks]
upload = "rattler-build upload anaconda -o Auto-Mech *.conda"
